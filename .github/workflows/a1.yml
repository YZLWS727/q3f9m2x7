name: a1

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: chromium
        run: |
          sudo apt-get update -qq
          python -m playwright install --with-deps chromium
        timeout-minutes: 5

      - name: mask
        env:
          M1: ${{ secrets.MASK_A }}
          M2: ${{ secrets.MASK_B }}
          M3: ${{ secrets.MASK_C }}
          M4: ${{ secrets.MASK_D }}
          M5: ${{ secrets.MASK_E }}
        run: |
          echo "::add-mask::$M1"
          echo "::add-mask::$M2"
          echo "::add-mask::$M3"
          echo "::add-mask::$M4"
          echo "::add-mask::$M5"

      - name: run
        run: |
          for i in 1 2 3; do
            python r1.py && break
            echo "attempt $i failed, waiting 300s"
            sleep 300
          done
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          PRIVATE_RAW_URL: ${{ secrets.PRIVATE_RAW_URL }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          OUTPUT_SUFFIX: ${{ secrets.OUTPUT_SUFFIX }}
          PHASE: crawl

      - name: raw backup
        if: always()
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          rclone copy ./output s3-cst:$S3_BUCKET/raw-backup --include "*" --quiet

      - name: raw verify
        if: always()
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          RAW_KEY: ${{ secrets.RAW_KEY }}
        run: |
          rclone lsl s3-cst:$S3_BUCKET/raw-backup | grep -F "$RAW_KEY" >/dev/null && echo "raw ok" || { echo "raw missing"; exit 1; }

      - name: rclone
        if: always()
        run: curl https://rclone.org/install.sh | sudo bash

      - name: sync
        if: always()
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          OUT_FILE_PATTERN: ${{ secrets.OUT_FILE_PATTERN }}
          RAW_EXCLUDE_PATTERN: ${{ secrets.RAW_EXCLUDE_PATTERN }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [s3-cst]
          type = s3
          provider = Other
          access_key_id = $S3_ACCESS_KEY
          secret_access_key = $S3_SECRET_KEY
          endpoint = $S3_ENDPOINT
          acl = private
          EOF
          rclone copy ./output s3-cst:$S3_BUCKET --include "$OUT_FILE_PATTERN" --exclude "$RAW_EXCLUDE_PATTERN" --quiet

      - name: verify
        if: always()
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          OUT_FILE_KEY: ${{ secrets.OUT_FILE_KEY }}
        run: |
          rclone lsl s3-cst:$S3_BUCKET | grep -F "$OUT_FILE_KEY" >/dev/null && echo "ok" || { echo "missing"; exit 1; }
