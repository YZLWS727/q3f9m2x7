name: a1

on:
  schedule:
    - cron: '2 16 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: enable a2
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/a2.yml/enable || echo "enable a2 failed（不阻塞抓取，下一轮 a1 会重试）"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
        timeout-minutes: 10

      - name: chromium
        run: |
          sudo apt-get update -qq
          python -m playwright install --with-deps chromium
        timeout-minutes: 15

      - name: mask
        env:
          M1: ${{ secrets.MASK_A }}
          M2: ${{ secrets.MASK_B }}
          M3: ${{ secrets.MASK_C }}
          M4: ${{ secrets.MASK_D }}
          M5: ${{ secrets.MASK_E }}
        run: |
          echo "::add-mask::$M1"
          echo "::add-mask::$M2"
          echo "::add-mask::$M3"
          echo "::add-mask::$M4"
          echo "::add-mask::$M5"

      - name: run
        timeout-minutes: 90
        run: |
          ok=0
          for i in 1 2 3; do
            if python r1.py; then ok=1; break; fi
            echo "attempt $i failed, waiting 300s"
            sleep 300
          done
          [ "$ok" = "1" ] || { echo "job script failed after 3 attempts"; exit 1; }
        env:
          PRIVATE_RAW_URL: ${{ secrets.PRIVATE_RAW_URL }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          OUTPUT_SUFFIX: ${{ secrets.OUTPUT_SUFFIX }}
          PHASE: crawl

      - name: commit raw
        if: always()
        run: |
          mkdir -p raw
          cp ./output/*原始未打标* raw/ 2>/dev/null || true
          if ls raw/*原始未打标* >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add raw/
            if ! git diff --cached --quiet; then
              git commit -m "raw: $(TZ=Asia/Shanghai date +%Y%m%d) 原始抓取备份"
              okp=0
              for i in 1 2 3; do
                git pull --rebase --autostash || true
                if git push; then okp=1; break; fi
                echo "raw push attempt $i failed, waiting 30s"
                sleep 30
              done
              [ "$okp" = "1" ] || { echo "raw commit push failed after 3 attempts"; exit 1; }
            else
              echo "raw already committed"
            fi
          else
            echo "no raw file to commit"
          fi

      - name: set raw date
        if: always()
        id: rawdate
        run: echo "date=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: upload raw artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.rawdate.outputs.date }}
          path: raw/*原始未打标*
          if-no-files-found: ignore
