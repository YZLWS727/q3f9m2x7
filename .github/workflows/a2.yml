name: a2

concurrency:
  group: infoflow-label
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 17-23,0-15 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: mask
        env:
          M1: ${{ secrets.MASK_A }}
          M2: ${{ secrets.MASK_B }}
          M3: ${{ secrets.MASK_C }}
          M4: ${{ secrets.MASK_D }}
          M5: ${{ secrets.MASK_E }}
        run: |
          echo "::add-mask::$M1"
          echo "::add-mask::$M2"
          echo "::add-mask::$M3"
          echo "::add-mask::$M4"
          echo "::add-mask::$M5"

      - name: run
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          PRIVATE_RAW_URL: ${{ secrets.PRIVATE_RAW_URL }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          OUTPUT_SUFFIX: ${{ secrets.OUTPUT_SUFFIX }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISABLE_A2_AFTER_DONE: '1'
          PHASE: label
        run: |
          python r1.py
