name: a2

concurrency:
  group: infoflow-label
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 17,23,5,11 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: mask
        env:
          M1: ${{ secrets.MASK_A }}
          M2: ${{ secrets.MASK_B }}
          M3: ${{ secrets.MASK_C }}
          M4: ${{ secrets.MASK_D }}
          M5: ${{ secrets.MASK_E }}
        run: |
          echo "::add-mask::$M1"
          echo "::add-mask::$M2"
          echo "::add-mask::$M3"
          echo "::add-mask::$M4"
          echo "::add-mask::$M5"

      - name: run
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          PRIVATE_RAW_URL: ${{ secrets.PRIVATE_RAW_URL }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
          OUTPUT_SUFFIX: ${{ secrets.OUTPUT_SUFFIX }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          PHASE: label
        run: |
          ok=0
          for i in 1 2 3; do
            if python r1.py; then ok=1; break; fi
            echo "attempt $i failed, waiting 300s"
            sleep 300
          done
          [ "$ok" = "1" ] || { echo "job script failed after 3 attempts"; exit 1; }

      - name: rclone
        if: always()
        run: curl https://rclone.org/install.sh | sudo bash

      - name: sync
        if: always()
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          OUT_FILE_PATTERN: ${{ secrets.OUT_FILE_PATTERN }}
          RAW_EXCLUDE_PATTERN: ${{ secrets.RAW_EXCLUDE_PATTERN }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [s3-cst]
          type = s3
          provider = Other
          access_key_id = $S3_ACCESS_KEY
          secret_access_key = $S3_SECRET_KEY
          endpoint = $S3_ENDPOINT
          acl = private
          EOF
          if [ -d ./output ]; then
            ok=0
            for i in 1 2 3 4 5; do
              if rclone copy ./output s3-cst:$S3_BUCKET --filter "+ $OUT_FILE_PATTERN" --filter "- $RAW_EXCLUDE_PATTERN" --quiet; then ok=1; break; fi
              echo "sync attempt $i failed, waiting 60s"
              sleep 60
            done
            [ "$ok" = "1" ] || { echo "sync failed after 5 attempts"; exit 1; }
          else
            echo "no output dir yet（打标未产出成品，等待下一窗口续跑）"
          fi

      - name: verify
        if: always()
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          OUT_FILE_KEY: ${{ secrets.OUT_FILE_KEY }}
        run: |
          TARGET_DATE=$(TZ=Asia/Shanghai date -d 'yesterday' +%Y%m%d)
          if rclone lsl s3-cst:$S3_BUCKET | grep -F "$TARGET_DATE" | grep -F "$OUT_FILE_KEY" >/dev/null; then
            echo "DONE $TARGET_DATE 成品已同步到时间胶囊桶"
          else
            echo "PENDING $TARGET_DATE 成品未完成（打标续跑中，属正常状态，看 run 步骤 PROGRESS）"
          fi
