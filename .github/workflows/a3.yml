name: a3

concurrency:
  group: a3-label
  cancel-in-progress: false

on:
  schedule:
    - cron: '5 1,17,18,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 YYYYMMDD（默认昨天，北京时间）'
        required: false
        default: ''
      time_budget_min:
        description: '运行时长上限（分钟），默认 330'
        required: false
        default: '330'
      force_rerun:
        description: '强制重跑（忽略检查点与成品存在性，出干净基准）'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["a1"]
    types: [completed]

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: python -m pip install --upgrade pip || true
        timeout-minutes: 5

      - name: resolve raw
        id: raw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then D="${{ inputs.target_date }}"; else D=$(TZ=Asia/Shanghai date -d "yesterday" +%Y%m%d); fi
          F=$(ls raw/*${D}*原始未打标*.md 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            echo "RAW_NOT_FOUND for $D"
            C=$(gh api "repos/${{ github.repository }}/actions/workflows/a1.yml/runs?per_page=1" --jq '.workflow_runs[0].conclusion // ""' 2>/dev/null || echo "unknown")
            S=$(gh api "repos/${{ github.repository }}/actions/workflows/a1.yml/runs?per_page=1" --jq '.workflow_runs[0].status // ""' 2>/dev/null || echo "unknown")
            echo "A1_LAST_CONCLUSION=$C STATUS=$S"
            if [ "$C" = "success" ] || [ "$S" = "in_progress" ]; then
              if [ "$C" = "success" ]; then
                echo "try artifact fallback"
                mkdir -p _art
                rm -rf _art/*
                ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=30" --jq ".artifacts[] | select(.name == \"raw-${D}\") | .id" 2>/dev/null | head -1)
                if [ -n "$ART_ID" ]; then
                  echo "ARTIFACT_FOUND id=$ART_ID"
                  curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" -o _art/raw.zip
                  if [ -s _art/raw.zip ]; then
                    unzip -o -q _art/raw.zip -d _art/x
                    AF=$(find _art/x -name "*${D}*原始未打标*.md" | head -1)
                    if [ -n "$AF" ]; then
                      mkdir -p raw
                      cp "$AF" raw/
                      F="raw/$(basename "$AF")"
                      echo "RAW_FROM_ARTIFACT $F"
                    else
                      echo "ARTIFACT_MISMATCH 包内无 ${D} 对应文件"
                    fi
                  else
                    echo "ARTIFACT_DOWNLOAD_FAIL"
                  fi
                else
                  echo "ARTIFACT_NOT_FOUND name=raw-${D}"
                fi
              fi
              if [ -z "$F" ]; then
                echo "A1 ok/running but raw not yet -> RETRY_LATER"
                exit 0
              fi
            else
              ls raw/ | tail -5
              exit 1
            fi
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "raw=$F" >> "$GITHUB_OUTPUT"

      - name: run a3 label
        if: steps.raw.outputs.raw != ''
        timeout-minutes: 350
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          TARGET_DATE: ${{ steps.raw.outputs.date }}
          RAW_PATH: ${{ steps.raw.outputs.raw }}
          RAW_DIR: raw
          A3_EXPLICIT: ${{ inputs.target_date != '' && '1' || '0' }}
          OUT_DIR: ./output-a3
          TIME_BUDGET_MIN: ${{ inputs.time_budget_min || '330' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_AUX_ENDPOINT: ${{ secrets.S3_AUX_ENDPOINT }}
          S3_AUX_BUCKET: ${{ secrets.S3_AUX_BUCKET }}
          S3_AUX_ACCESS_KEY: ${{ secrets.S3_AUX_ACCESS_KEY }}
          S3_AUX_SECRET_KEY: ${{ secrets.S3_AUX_SECRET_KEY }}
          RUN_EVENT: ${{ github.event_name }}
        run: python a3_label.py ${{ inputs.force_rerun == true && '--fresh' || '' }}

      - name: ds tag backstop top300
        if: steps.raw.outputs.raw != '' && !cancelled()
        timeout-minutes: 90
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TARGET_DATE: ${{ steps.raw.outputs.date }}
          RAW_PATH: ${{ steps.raw.outputs.raw }}
          OUT_DIR: ./output-a3
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_AUX_ENDPOINT: ${{ secrets.S3_AUX_ENDPOINT }}
          S3_AUX_BUCKET: ${{ secrets.S3_AUX_BUCKET }}
          S3_AUX_ACCESS_KEY: ${{ secrets.S3_AUX_ACCESS_KEY }}
          S3_AUX_SECRET_KEY: ${{ secrets.S3_AUX_SECRET_KEY }}
        run: |
          if [ -f ./output-a3/processed_date.txt ]; then export TARGET_DATE="$(cat ./output-a3/processed_date.txt)"; fi
          if [ -f ./output-a3/processed_raw.txt ]; then export RAW_PATH="$(cat ./output-a3/processed_raw.txt)"; fi
          python t1.py

      - name: upload a3 artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a3-${{ steps.raw.outputs.date }}
          path: ./output-a3/
          if-no-files-found: ignore
          overwrite: true
