name: a3

concurrency:
  group: a3-label
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 YYYYMMDD（默认昨天，北京时间）'
        required: false
        default: ''
      time_budget_min:
        description: '运行时长上限（分钟），默认 330'
        required: false
        default: '330'

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: python -m pip install --upgrade pip || true
        timeout-minutes: 5

      - name: resolve raw
        id: raw
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then D="${{ inputs.target_date }}"; else D=$(TZ=Asia/Shanghai date -d "yesterday" +%Y%m%d); fi
          F=$(ls raw/*${D}*原始未打标*.md 2>/dev/null | head -1)
          if [ -z "$F" ]; then echo "RAW_NOT_FOUND for $D"; ls raw/ | tail -5; exit 1; fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "raw=$F" >> "$GITHUB_OUTPUT"

      - name: run a3 label
        timeout-minutes: 350
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          TARGET_DATE: ${{ steps.raw.outputs.date }}
          RAW_PATH: ${{ steps.raw.outputs.raw }}
          OUT_DIR: ./output-a3
          TIME_BUDGET_MIN: ${{ inputs.time_budget_min }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: python a3_label.py

      - name: upload a3 artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a3-${{ steps.raw.outputs.date }}
          path: ./output-a3/
          if-no-files-found: ignore
          overwrite: true
