name: a3

concurrency:
  group: a3-label
  cancel-in-progress: false

on:
  schedule:
    - cron: '5 1,17,18,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 YYYYMMDD（默认昨天，北京时间）'
        required: false
        default: ''
      time_budget_min:
        description: '运行时长上限（分钟），默认 330'
        required: false
        default: '330'
      force_rerun:
        description: '强制重跑（忽略检查点与成品存在性，出干净基准）'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["a1"]
    types: [completed]

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: python -m pip install --upgrade pip || true
        timeout-minutes: 5

      - name: resolve raw
        id: raw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then D="${{ inputs.target_date }}"; else D=$(TZ=Asia/Shanghai date -d "yesterday" +%Y%m%d); fi
          F=$(ls raw/*${D}*原始未打标*.md 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            echo "RAW_NOT_FOUND for $D"
            C=$(gh api "repos/${{ github.repository }}/actions/workflows/a1.yml/runs?per_page=1" --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo "unknown")
            echo "A1_LAST_CONCLUSION=$C"
            if [ "$C" = "success" ]; then
              echo "A1 ok but raw not yet -> RETRY_LATER"
              exit 0
            fi
            ls raw/ | tail -5
            exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "raw=$F" >> "$GITHUB_OUTPUT"

      - name: run a3 label
        if: steps.raw.outputs.raw != ''
        timeout-minutes: 350
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          TARGET_DATE: ${{ steps.raw.outputs.date }}
          RAW_PATH: ${{ steps.raw.outputs.raw }}
          RAW_DIR: raw
          A3_EXPLICIT: ${{ inputs.target_date != '' && '1' || '0' }}
          OUT_DIR: ./output-a3
          TIME_BUDGET_MIN: ${{ inputs.time_budget_min || '330' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_AUX_ENDPOINT: ${{ secrets.S3_AUX_ENDPOINT }}
          S3_AUX_BUCKET: ${{ secrets.S3_AUX_BUCKET }}
          S3_AUX_ACCESS_KEY: ${{ secrets.S3_AUX_ACCESS_KEY }}
          S3_AUX_SECRET_KEY: ${{ secrets.S3_AUX_SECRET_KEY }}
        run: python a3_label.py ${{ inputs.force_rerun == true && '--fresh' || '' }}

      - name: upload a3 artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a3-${{ steps.raw.outputs.date }}
          path: ./output-a3/
          if-no-files-found: ignore
          overwrite: true
