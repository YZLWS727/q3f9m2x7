name: repair-flow

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'S3 中待修复的成品文件名（默认 8/19 智谱）'
        required: false
        default: '20260819周三全网宏观信息流-智谱.md'

concurrency:
  group: repair-flow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      TARGET_FILE: ${{ inputs.target_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repair (硅基流动 + DeepSeek 兜底)
        run: |
          python repair_flow.py --file "$TARGET_FILE" --out-dir ./output

      - name: Upload repaired artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: repair-0819-output
          path: |
            output/
            MODEL_GONE_ALERT.txt
          overwrite: true
